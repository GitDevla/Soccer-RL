default_settings: null
behaviors:
  Player:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 5120
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
    init_path: null
    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 500000000
    time_horizon: 1000
    summary_freq: 10000
    threaded: true
    self_play:
      save_steps: 50000
      team_change: 20
      swap_steps: 50000
      window: 100
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
    behavioral_cloning: null
env_settings:
  env_path: null
  env_args: null
  base_port: 5005
  num_envs: 1
  num_areas: 1
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
environment_parameters:
  difficulty:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 1204
          value: 0
      name: easy
      completion_criteria:
        behavior: Player
        measure: reward
        min_lesson_length: 10000
        signal_smoothing: true
        threshold: 0.4
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 1205
          value: 1
      name: medium
      completion_criteria:
        behavior: Player
        measure: reward
        min_lesson_length: 20000
        signal_smoothing: true
        threshold: 0.8
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 1206
          value: 2
      name: hard
      completion_criteria:
        behavior: Player
        measure: reward
        min_lesson_length: 30000
        signal_smoothing: true
        threshold: 1.0
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 1207
          value: 3
      name: extreme
      completion_criteria:
        behavior: Player
        measure: reward
        min_lesson_length: 40000
        signal_smoothing: true
        threshold: 0.8
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 1208
          value: 4
      name: self-play-transition
      completion_criteria: null
checkpoint_settings:
  run_id: self_play_sparse
  initialize_from: null
  load_model: false
  resume: false
  force: true
  train_model: false
  inference: false
  results_dir: results
torch_settings:
  device: null
debug: false
