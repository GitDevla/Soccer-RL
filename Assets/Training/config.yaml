behaviors:
  Player:
    trainer_type: ppo
    threaded: true
    hyperparameters:
      batch_size: 512
      buffer_size: 5120
      learning_rate: 3.0e-4
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 5.0e8
    time_horizon: 1000
    summary_freq: 10000

    self_play:
      save_steps: 50000
      team_change: 100000
      swap_steps: 10000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 0

environment_parameters:
  difficulty:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: Player
          threshold: 0.4
          min_lesson_length: 1000
        value: 0
      - name: medium
        completion_criteria:
          measure: reward
          behavior: Player
          threshold: 0.8
          min_lesson_length: 2000
        value: 1
      - name: hard
        value: 2
        completion_criteria:
          measure: reward
          behavior: Player
          threshold: 1.0
          min_lesson_length: 3000
      - name: extreme
        value: 3
        completion_criteria:
          measure: reward
          behavior: Player
          threshold: 0.8
          min_lesson_length: 4000
      - name: self-play-transition
        value: 4
        completion_criteria:
          measure: reward
          behavior: Player
          threshold: 0.1
          min_lesson_length: 5000
      - name: self-play
        value: 5
