behaviors:
  Player:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 5120
      learning_rate: 0.0001
      beta: 0.001
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 4

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 5.0e8
    time_horizon: 1000
    summary_freq: 10000

    self_play:
      save_steps: 100000
      team_change: 200000
      swap_steps: 2000
      window: 100
      play_against_latest_model_ratio: 0.5
      initial_elo: 0
environment_parameters:
  difficulty:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: Player
          threshold: 0.0
          min_lesson_length: 1000
        value: 0
      - name: medium
        value: 1
        completion_criteria:
          measure: reward
          behavior: Player
          threshold: 0.4
          min_lesson_length: 2000
      - name: hard
        value: 2
        completion_criteria:
          measure: reward
          behavior: Player
          threshold: 0.8
          min_lesson_length: 3000
      - name: extreme
        value: 3
        completion_criteria:
          measure: reward
          behavior: Player
          threshold: 0.8
          min_lesson_length: 4000
      - name: self-play-transition
        value: 4
        completion_criteria:
          measure: reward
          behavior: Player
          threshold: -0.9
          min_lesson_length: 1
      - name: self-play
        value: 5
torch_settings:
  device: cpu
